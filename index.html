<div id="ag" class="scr on"><h1>⚠ 年齡確認</h1><p>本遊戲含強烈驚嚇、突然巨響、閃爍畫面與恐怖意象。<br>你是否已滿 18 歲？</p><div><button onclick="yes()">我已滿 18 歲</button><button onclick="no()">未滿 18 歲</button></div></div>

<div id="cv" class="scr"><svg viewBox="0 0 200 300"><use href="#si"/></svg><h1>千蟬學校：第二章</h1><p class="sub">她一直都在看著你。<br>一個不會說話的女孩，一條通往校舍更深處的路。這一次，別相信任何指引。</p><div class="cast"><svg viewBox="0 0 200 240"><use href="#yu"/></svg><span>小羽，16 歲。知道的，比他說的多。</span></div><button onclick="newGame()">踏入校舍</button><div id="ctw"><button id="ct">▶ 繼續遊戲</button><button id="cd">🗑 刪除存檔</button></div></div>

<div id="g" class="scr"><div id="hud"><b id="rt"></b><button id="sv" onclick="save(1)">💾 存檔</button><span id="hp"></span></div><div id="sn"></div><div id="ds"></div><div id="lg"></div><div id="hs"></div><div id="bx"></div><div id="iv"></div></div>

<div id="dt" class="scr"><h1>你死了</h1><p>錯誤累積了五次。她一直都在看著你。</p><button onclick="start()">全部重新再來</button></div>
<div id="en" class="scr"><h1>第二章　完</h1><p>偲涵從頭到尾，都在反抗。<br>下一個，是印潔。</p><button onclick="start()">重新遊玩</button></div>

<script>
const $=s=>document.querySelector(s),sl=ms=>new Promise(r=>setTimeout(r,ms));
let A,S,sel,busy=0,dr=0;
function ac(){if(!A)try{A=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}if(A&&A.state=='suspended')A.resume();return A}
function tone(f,d=.4,ty='sine',v=.2){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}
function noise(d,v){const a=ac();if(!a)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const s=a.createBufferSource(),g=a.createGain();s.buffer=b;g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);s.connect(g);g.connect(a.destination);s.start()}
function drone(){const a=ac();if(!a)return;[55,58.5].forEach(f=>{const o=a.createOscillator(),g=a.createGain();o.type='sawtooth';o.frequency.value=f;g.gain.value=.025;o.connect(g);g.connect(a.destination);o.start()})}
async function scare(t,big){$('#sct').textContent=t||'';document.body.classList.add('fl');await sl(450);document.body.classList.remove('fl');$('#sc').style.display='flex';noise(1,.9);tone(80,1,'sawtooth',.45);tone(1700,.6,'square',.12);document.body.classList.add('sk');await sl(big?1500:850);$('#sc').style.display='none';document.body.classList.remove('sk')}
function hud(){$('#hp').textContent='☠'.repeat(S.w)+'·'.repeat(5-S.w)+' '+S.w+'/5';document.body.style.setProperty('--v',S.w/5)}
async function bad(m){S.w=Math.min(5,S.w+(S.f.p3&&S.w<4?2:1));hud();save();say(m||'錯了。');if(S.w>=5)return die();await scare()}
async function die(){S.on=0;busy=0;clr();await scare('她抓到你了',1);$('#g').classList.remove('on');$('#dt').classList.add('on')}
const tap=()=>new Promise(r=>{const e=$('#lg');e.onclick=()=>{e.onclick=null;r()};$('#lg p').insertAdjacentHTML('beforeend',' ▼')});
async function say(l){l=[].concat(l);const m=l.length>1;if(m)busy=1;for(let i=0;i<l.length;i++){const x=l[i],a=Array.isArray(x),w=a?x[0]:'',t=a?x[1]:x;$('#lg').innerHTML=(w?`<svg class="pt" viewBox="0 0 200 ${w=='yu'?240:300}"><use href="#${w}"/></svg><b class="nm">${w=='yu'?'小羽':'偲涵'}</b>`:'')+`<p>${t}</p>`;if(i<l.length-1)await tap()}if(m)busy=0}
const fg=(k,v,m)=>{S.f[k]=v;say(m+'（已記入筆記）');if(!S.f.ij&&['a','b','c','e','g','h'].filter(x=>S.f[x]).length>=3){S.f.ij=1;ij()}};
function get(n){if(!S.inv.includes(n))S.inv.push(n);iv()}
function note(){const f=S.f;say('📓 ①走廊：'+(f.a||'？')+'　②圖書室：'+(f.b||'？')+'　③音樂室：'+(f.c||'？')+'　④偲涵：'+(f.e||'？')+'　⑤保健室：'+(f.g||'？')+'　⑥暗房：'+(f.h||'？')+'　鐵門的數字，依序填入。'+(f.nm?'　【名字的線索】'+f.nm.join('；'):''))}
function iv(){const e=$('#iv');e.innerHTML='🎒 選取物品後，再點物件使用<br>';S.inv.forEach(n=>{const b=document.createElement('button');b.textContent=n;b.className=sel==n?'sel':'';b.onclick=()=>{sel=sel==n?null:n;iv()};e.append(b)});const b=document.createElement('button');b.textContent='📓 筆記';b.onclick=note;e.append(b)}
function render(){const R=RM[S.r];$('#rt').textContent=R.t;$('#ds').textContent=R.d+(Math.random()<.25+S.w*.12?' '+CR[Math.random()*CR.length|0]:'');art();$('#bx').innerHTML='';$('#hs').innerHTML='';R.h().forEach(([n,f])=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{if(!busy)f()};$('#hs').append(b)});iv();save()}
async function go(r){S.r=r;render();if(EN[r]&&!S.f['v'+r]){S.f['v'+r]=1;say(EN[r])}if(r=='cls'&&!S.f.yu){S.f.yu=1;await say([['yu','「不要再探索下去了，你神人喔。」'],'「……你也是學生？」','他沒回答，只問：「妳沒發現這間學校很奇怪嗎？」',['yu','封鎖的教室，每晚門會自己打開。名冊上有不存在的學生。還有一份十幾年前的紀錄，反覆出現同一個名字——偲涵。她的筆記本上，只有一句話：「不是我」。'],'你回頭。走廊上的偲涵，不見了。'])}}
function ask(ph,ans,ok,msg){$('#bx').innerHTML=`<input id="in" placeholder="${ph}" autocomplete="off"><button id="go">確認</button>`;$('#go').onclick=()=>{if($('#in').value.trim()==ans){$('#bx').innerHTML='';ok()}else bad(msg)}}
function seq(L,ans,mode,ok){let k=0,run=0,rp=S.f.p3?1:3;const fr=[262,330,440,587,698],sp=S.f.p3?380:500;$('#bx').innerHTML='<div>'+L.map(x=>`<button class="q">${x}</button>`).join('')+'</div>'+(mode=='o'?'':`<button id="pl">▶ 再播放（剩 ${rp} 次）</button>`);const bs=[...document.querySelectorAll('.q')];
const pl=async()=>{run=1;k=0;bs.forEach(b=>b.classList.remove('ok'));for(const i of ans){mode=='a'?tone(fr[i],.5):bs[i].classList.add('lit');await sl(sp);bs[i].classList.remove('lit');await sl(sp/2)}run=0};
if(mode!='o'){$('#pl').onclick=()=>{if(!run&&rp>0){rp--;$('#pl').textContent='▶ 再播放（剩 '+rp+' 次）';pl()}};setTimeout(pl,400)}
bs.forEach((b,i)=>b.onclick=()=>{if(run)return;if(mode=='a')tone(fr[i],.4);if(i==ans[k]){b.classList.add('ok');if(++k==ans.length){$('#bx').innerHTML='';ok()}}else{k=0;bs.forEach(x=>x.classList.remove('ok'));bad('順序不對。')}})}
const hint=()=>{const f=S.f;return f.p2?(!f.pw?'配電箱的規則，被拆在兩個地方。地上的紙團，別信。':!f.wc?'女廁的鏡子，左右是反的。塗鴉是假的。':!f.vd?'視聽室。找出第二個畫面裡，多出來的東西。':!f.dd?'宿舍的人，這學期全都往右移了一格，最右邊的換到最左邊。':!f.ch?'體育館。她怕光、追聲音，而且，別回頭。':'303。她把人帶走的順序，日記裡寫了。'):!f.cab?'鏡子裡的東西，左右是反的。桌上那張紙條……太刻意了。':!f.b?'粉筆、空白借書卡。看起來沒用的東西，才危險。':!f.rec?'書脊亮的順序。多看幾次。':!f.c?'鑰匙是開音樂教室的。那裡的謎，用耳朵解。':!f.a?'走廊的公布欄。有些東西，回頭才看得懂。':!f.e?'去找偲涵。看她比劃什麼。':!f.g?'保健室的藥，順序不能錯。規則被拆成兩半，藏在兩個地方。':!f.rm?'那顆電池，門禁盒需要它。':!f.rd?'廣播室。只能聽，而且只能再聽幾次。':!f.h?'暗房需要紅光。你手上，有個沒人在意的小東西。':'鐵門有三層。第二層……想想她筆記本上唯一那句話。第三層，別動。'};
const TH={hall:['#1c2736','#06080c','🚪'],cls:['#2a2a1c','#080806','🪞'],lib:['#2a1c14','#0a0604','📚'],mus:['#1c1c34','#05050c','🎹'],med:['#1c3030','#050c0c','🩺'],rad:['#33201c','#0c0605','📻'],dk:['#3a0808','#0a0000','📷'],old:['#14141a','#000','🏚'],base:['#14201a','#020604','🕳'],wc:['#1c2c30','#040a0c','🚻'],av:['#20203a','#04040c','🎬'],dm:['#2c1c2c','#0a040a','🛏'],gym:['#2c2a1c','#0a0904','🏀'],r303:['#1a1a1a','#000','🪑']};

async function oldIntro(){await say(['鐵門之後，是一棟從未出現過的舊校舍。','印潔已經走了進去，一扇門在她身後落下，將你們隔開。',['si','偲涵站在你面前。她抬起頭，嘴型慢慢重複同一個動作——「快、走」。'],'燈全滅了。黑暗裡，傳來很多人緩慢靠近的腳步聲。']);await sl(1800);await scare('',1);say([['yu','牆上的符號……紀錄裡寫過順序。快！']])}
async function end(r){if(!r)return bad('門後，有人在等你。');act2()}
async function act3(){S.f.p3=1;await say(['黑板上的名字一個個亮起，最後停在「偲涵」。','然後，字跡開始滲血。第四個名字下面，浮現了第五個——','「慈幽」。',['si','偲涵站在門口。她的嘴型，一遍又一遍：「十七年。十七年。十七年。」'],['yu','……校長室。紀錄裡提過，每隔十七年，她醒一次。答案在那裡。快去！']]);busy=1;card('第三夜','十七年');await sl(3300);busy=0;go('hall')}
async function fin(){if(S.f.p3)return ending();return act3()}
async function ending(){busy=1;S.on=0;clr();await say([['si','偲涵回過頭。她的眼神，一點一點變得空洞，身體不自然地抽動。'],['yu','離她遠一點！'],'她走向欄杆。你抓住她的手。她第一次流下眼淚，一直搖頭，嘴型無聲：「對不起」。','然後，她的嘴型換了。三個字。你認得——林、語、蟬。','下一秒，那個東西徹底控制了她。偲涵翻過欄杆，消失在黑暗裡。','她不說話，是它不允許。她跟著你，是想警告你。她從頭到尾，都在反抗。','十七年前，也是這樣。十七年後，也是這樣。','筆記本的最後一頁，浮現一行原本不存在的字：「下一個，是印潔。」','你猛然回頭。印潔站在你身後——她的眼睛，已經不是原本的樣子了。']);await sl(2500);busy=0;await scare('她一直都在看著你',1);$('#g').classList.remove('on');$('#en').classList.add('on')}
function yes(){ac();$('#ag').classList.remove('on');$('#cv').classList.add('on')}
function no(){$('#ag').innerHTML='<h1>抱歉</h1><p>未滿 18 歲，無法遊玩。</p>'}
async function start(){['cv','dt','en'].forEach(i=>$('#'+i).classList.remove('on'));S={r:'hall',inv:[],f:{},w:0,on:1};sel=null;busy=0;$('#g').classList.add('on');$('#tt').classList.remove('on');void $('#tt').offsetWidth;$('#tt').classList.add('on');hud();if(!dr){dr=1;drone()}render();say(['地下室的門在身後關上。慈幽扶著印潔，終於走回了走廊。','「……等等。」印潔停下腳步。「有人在叫我。聲音，和妳一模一樣。」',['si','走廊盡頭，那個女生又站在那裡。'],'是她。第一章裡，她也是這樣，一句話都沒說，只是盯著你們。眼睛，幾乎沒有眨。','她抬起手，指向校舍深處。然後，不見了。','「她好像知道些什麼……」「正因為這樣，才更可怕。」'])}

/* ===== 存檔系統（自動存檔 / 手動存檔 / 繼續遊戲） ===== */
const SK='cs2_save';
const toast=t=>{const e=$('#ts');e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,1600)};
function save(m){try{if(!S||!S.on||busy){m&&toast('現在不能存檔');return}localStorage.setItem(SK,JSON.stringify({r:S.r,inv:S.inv,f:S.f,w:S.w}));m&&toast('💾 已存檔')}catch(e){}}
function clr(){try{localStorage.removeItem(SK)}catch(e){}}
function load(){let d;try{d=JSON.parse(localStorage.getItem(SK))}catch(e){}if(!d)return;if(!RM[d.r])d.r='hall';['cv','dt','en'].forEach(i=>$('#'+i).classList.remove('on'));S={r:d.r,inv:d.inv||[],f:d.f||{},w:d.w||0,on:1};sel=null;busy=0;$('#g').classList.add('on');hud();if(!dr){dr=1;drone()}render();say('（已讀取存檔。她，一直在等你回來。）')}
function newGame(){let h=0;try{h=localStorage.getItem(SK)}catch(e){}if(h&&!confirm('開始新遊戲會覆蓋目前的存檔，確定嗎？'))return;start()}
const rf5=()=>{let h=0;try{h=localStorage.getItem(SK)}catch(e){}$('#ctw').style.display=h?'':'none'};rf5();
$('#ct').onclick=()=>{ac();load()};$('#cd').onclick=()=>{clr();rf5()};
setInterval(()=>save(),4000);addEventListener('pagehide',()=>save());document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
setInterval(()=>{if(S&&S.on&&S.f.p3&&!busy&&Math.random()<.35)scare()},15000);

(function hb(){if(S&&S.on&&A){tone(50,.18,'sine',.3);setTimeout(()=>tone(45,.14,'sine',.22),200)}setTimeout(hb,1900-(S?S.w:0)*300)})();
setInterval(()=>{if(S&&S.on&&!busy&&Math.random()<.25+S.w*.1)scare()},25000);
</script></body></html>
